<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submittal Builder Visual Comparison</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; background: #dfe4ea; color: #14273a; font: 600 15px/1.4 Arial, sans-serif; }
        h1 { margin: 0 0 18px; font-size: 22px; }
        main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        figure { margin: 0; padding: 12px; background: #fff; border: 1px solid #bac4cf; border-radius: 8px; box-shadow: 0 4px 16px rgba(20, 39, 58, .08); }
        figcaption { margin: 0 0 9px; }
        img { display: block; width: 100%; height: auto; border: 1px solid #d7dde3; }
    </style>
</head>
<body>
    <h1>Submittal Builder — 1204 × 854 desktop comparison</h1>
    <main>
        <figure>
            <figcaption>Reference supplied by user</figcaption>
            <img src="source-submittal-builder-reference.png" alt="Reference Submittal Builder">
        </figure>
        <figure>
            <figcaption>Homepage implementation</figcaption>
            <img src="implementation-submittal-builder-1204x854.png" alt="Implemented Submittal Builder">
        </figure>
    </main>
</body>
</html>
